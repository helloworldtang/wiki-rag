[project]
name = "wiki-rag"
version = "0.1.0"
description = "个人Wiki知识库RAG - LLM编译Wiki + 本地向量检索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "ollama>=0.3",
    "openai>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
