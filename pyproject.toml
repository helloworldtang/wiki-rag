[project]
name = "wiki-rag"
version = "0.2.0"
description = "个人Wiki知识库RAG - LLM编译Wiki + 本地向量检索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "ollama>=0.3",
    "openai>=2.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_rag"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true
